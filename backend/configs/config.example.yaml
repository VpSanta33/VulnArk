# Copy to a private file OUTSIDE the repository, restrict permissions to 600,
# then set VULNARK_CONFIG=/absolute/path/to/private-config.yaml.
# JWT_SECRET, SECURITY_MFA_ENCRYPTION_KEY and DATABASE_PASSWORD override YAML,
# including when the corresponding YAML key is absent. Empty env values fail validation.
# No usable secrets are included or generated by the application.
server:
  host: "127.0.0.1"
  port: "8080"
  mode: "release"
  read_timeout: 120
  write_timeout: 120
  trusted_proxies: [] # Add only the IP/CIDR of your actual reverse proxy.

cors:
  enabled: true
  allowed_origins: ["http://localhost:8080", "http://127.0.0.1:8080"]
  # Replace with exact deployed frontend origins; wildcard origins are rejected.
  allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"]
  allowed_headers: ["Origin", "Content-Length", "Content-Type", "Authorization", "X-Requested-With", "Accept"]
  exposed_headers: ["Content-Length", "Content-Type"]
  allow_credentials: false
  max_age: 43200

database:
  host: "localhost"
  port: 3306
  username: "vulnark"
  password: "" # Required, at least 12 bytes; use a dedicated database account.
  database: "vulnark"
  charset: "utf8mb4"

jwt:
  secret: "" # Required, at least 32 bytes from a secure random source.
  expire_time: 3600

security:
  # Exact origins only; empty denies private/loopback destinations by default.
  # Example for an administrator-approved local AI: ["http://127.0.0.1:11434"]
  outbound_private_origins: []
  # Independent raw 32-byte AES-256 key; never reuse jwt.secret.
  # Store securely and back up: rotation requires migrating existing MFA data.
  mfa_encryption_key: ""

oss:
  provider: "local"
  access_key_id: ""
  access_key_secret: ""
  bucket: "vulnark-files"
  endpoint: ""
  region: ""

email:
  host: "smtp.qq.com"
  port: 587
  username: ""
  password: ""
  from: ""

storage:
  type: "local"
  local_path: "./uploads"
  base_url: "/uploads"
  max_file_size: 10485760
  max_files: 5
  max_request_size: 52428800

log:
  level: "info"
  format: "json"
  output: "stdout"

risk_intel:
  # Background sync of FIRST EPSS scores (only for CVE IDs recorded in VulnArk)
  # and the CISA KEV catalog into local cache tables. Risk scoring reads the
  # cache only; a failed sync keeps the previous data and is retried later.
  # Set enabled to false for air-gapped deployments: scoring then uses CVSS,
  # asset importance and exposure.
  enabled: true
  # Point these at an internal mirror if the public feeds are unreachable. A
  # private mirror must also be listed in security.outbound_private_origins.
  epss_api_url: "https://api.first.org/data/v1/epss"
  kev_feed_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  sync_interval_hours: 24 # 1-720
  request_timeout_seconds: 30 # 5-120
