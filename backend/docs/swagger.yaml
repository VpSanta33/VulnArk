      error:
        type: string
      headers:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      response_time:
        description: 响应时间（毫秒）
        type: integer
      status_code:
        type: integer
    type: object
  controller.APIVersion:
    properties:
