            $ref: '#/definitions/model.Response'
        "404":
          description: 当前漏洞不存在
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: 权限检查失败
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取重复漏洞候选
      tags:
      - 漏洞管理
  /api/v1/vulnerabilities/owasp-categories:
    get:
      description: 获取所有OWASP分类
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.OWASPCategory'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取OWASP分类列表
      tags:
      - 漏洞管理
  /api/v1/vulnerabilities/severity-levels:
    get:
      description: 获取所有可用的严重程度
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取严重程度列表
      tags:
      - 漏洞管理
  /api/v1/vulnerabilities/sla/overdue:
    get:
      description: 需要 vuln:read 权限。返回响应或修复逾期且未暂停、未完成的漏洞；普通漏洞列表也支持 sla_status=overdue
        筛选。
      parameters:
      - default: 100
        description: 返回数量
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.VulnerabilityInfo'
                  type: array
              type: object
        "400":
          description: limit必须为1-1000
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/model.Response'
        "403":
          description: 缺少vuln:read权限
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: 获取逾期列表失败
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取SLA逾期漏洞
      tags:
      - SLA管理
  /api/v1/vulnerabilities/stats:
    get:
      description: 获取漏洞统计信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.VulnerabilityStats'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取漏洞统计
      tags:
      - 漏洞管理
  /api/v1/vulnerabilities/status-list:
    get:
      description: 获取所有可用的状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  items:
                    additionalProperties:
                      type: string
                    type: object
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取状态列表
      tags:
      - 漏洞管理
  /api/versions:
    get:
      description: 获取系统支持的所有API版本信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/controller.APIVersionInfo'
              type: object
      summary: 获取API版本信息
      tags:
      - API版本管理
  /api/versions/{version}:
    get:
      description: 获取指定API版本的详细信息
      parameters:
      - description: API版本号
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/controller.APIVersion'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.Response'
      summary: 获取特定版本详情
      tags:
      - API版本管理
  /api/versions/compatibility:
    get:
      description: 获取不同API版本之间的兼容性信息
      parameters:
      - description: 源版本
        in: query
        name: from
        required: true
        type: string
      - description: 目标版本
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/controller.APICompatibility'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
      summary: 获取版本兼容性信息
      tags:
      - API版本管理
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
