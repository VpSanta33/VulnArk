  /api/v1/analytics/export:
    get:
      description: 按筛选条件即时生成并返回 CSV 文件流，不接受文件路径参数。需要 analytics:read、analytics:export
        权限，type=user 额外需要 user:manage 权限。
      parameters:
      - description: 导出类型
        enum:
        - dashboard
        - vulnerability
        - asset
        - report
        - user
        in: query
        name: type
        required: true
        type: string
      - default: csv
        description: 当前仅支持 csv
        enum:
        - csv
        in: query
        name: format
        type: string
      - description: 开始日期 (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: 结束日期 (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: 时间粒度
        enum:
        - day
        - week
        - month
        in: query
        name: granularity
        type: string
      - description: 资产ID
        in: query
        name: asset_id
        type: string
      - description: 用户ID
        in: query
        name: user_id
        type: string
      - description: 严重程度
        in: query
        name: severity
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 分类
        in: query
        name: category
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV 文件流
          headers:
            Cache-Control:
              description: no-store
              type: string
            Content-Disposition:
              description: attachment; filename=导出文件名.csv
              type: string
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 下载统计CSV
      tags:
      - 统计分析
    post:
      consumes:
      - application/json
      description: '创建统计 CSV 并返回 file_name、file_url、file_size，其中 file_url 是携带相同筛选条件的鉴权
        GET 下载链接，下载时仍须提供 Authorization: Bearer 访问令牌。当前仅实现 csv，excel、pdf 请求返回 400。请求字段
        type、format 必填，start_date、end_date 可选；filters 支持 asset_id、user_id、severity、status、category、granularity。需要
        analytics:read、analytics:export 权限，type=user 额外需要 user:manage 权限。'
      parameters:
      - description: 导出请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.ExportResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 导出数据
      tags:
      - 统计分析
