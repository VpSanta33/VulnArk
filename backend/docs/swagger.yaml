info:
  contact: {}
  description: VulnArk 漏洞管理系统。创建漏洞同时支持 JSON 和 multipart；敏感文件必须携带 Bearer token 下载。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: VulnArk API
  version: 1.1.0
paths:
  /api/changelog:
    get:
      description: 获取API的版本变更历史记录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
      summary: 获取API变更日志
      tags:
      - API版本管理
  /api/health:
    get:
      description: 获取当前API的健康状态和运行信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: 获取API健康状态
      tags:
      - API版本管理
  /api/status:
    get:
      description: 获取API服务的实时状态信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: 获取API状态页面信息
      tags:
      - API版本管理
  /api/v1/ai/chat:
    post:
      consumes:
      - application/json
      description: 向AI助手发送消息并获取回复
      parameters:
      - description: 聊天请求
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/model.AIChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AIChatResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "409":
          description: 会话忙碌、已关闭或租约失效
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 发送消息
      tags:
      - AI
  /api/v1/ai/config:
    get:
      consumes:
      - application/json
      description: 获取当前用户的AI助手配置
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AIConfiguration'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取AI配置
      tags:
      - AI
    post:
      consumes:
      - application/json
      description: 保存或更新用户的AI助手配置
      parameters:
      - description: AI配置
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/model.AIConfigurationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "500":
