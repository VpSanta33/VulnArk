  /api/v1/vulnerabilities:
    get:
      description: 获取漏洞列表（分页）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 严重程度
        in: query
        name: severity_level
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 资产ID
        in: query
        name: asset_id
        type: string
      - description: 分配人ID
        in: query
        name: assignee_id
        type: string
      - description: 发现人ID
        in: query
        name: discoverer_id
        type: string
      - description: OWASP分类ID
        in: query
        name: owasp_category_id
        type: string
      - description: 开始日期
        in: query
        name: start_date
        type: string
      - description: 结束日期
        in: query
        name: end_date
        type: string
      - description: SLA状态
        enum:
        - none
        - within
        - paused
        - overdue
        - completed
        in: query
        name: sla_status
        type: string
      - description: 风险优先级档位
        enum:
        - P1
        - P2
        - P3
        - P4
        in: query
        name: risk_priority
        type: string
      - description: 最低风险评分
        in: query
        maximum: 100
        minimum: 0
        name: min_risk_score
        type: number
      - description: 仅显示已收录于CISA KEV的漏洞
        in: query
        name: kev_only
        type: boolean
      - description: 排序字段，默认按创建时间
        enum:
        - created_at
        - risk_score
        in: query
        name: sort_by
        type: string
      - description: 排序方向，默认降序；未评分的漏洞始终排在最后
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.PaginationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取漏洞列表
      tags:
      - 漏洞管理
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: 创建漏洞支持 application/json（直接提交漏洞对象，无附件）和 multipart/form-data（data
        为同一对象的 JSON 字符串，screenshots 为可重复的文件字段）。JSON 字段：title、description、cve_id、cnvd_id、owasp_category_id、severity_level、cvss_score、asset_id、assignee_id、impact_scope、reproduction_steps、fix_suggestion；必填
        title、severity_level（1-4）、asset_id，cvss_score 为 0-10。拒绝未知字段或多余 JSON。Swagger
        2 无法在同一操作混用 body 与 formData 参数，以下参数展示 multipart 形式；JSON 请求请使用 application/json
        直接发送对象。
      parameters:
      - description: 漏洞对象的JSON字符串，例如 {\
        in: formData
        name: data
        required: true
        type: string
      - description: 漏洞截图；多文件重复使用 screenshots 字段
        in: formData
        name: screenshots
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Vulnerability'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "413":
          description: 请求超过上传大小限制
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建漏洞
      tags:
      - 漏洞管理
