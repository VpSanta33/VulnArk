        type: integer
      - description: 部门
        in: query
        name: department
        type: string
      - description: 是否启用
        in: query
        name: enabled
        type: boolean
      - default: 1
        description: 页码
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        maximum: 50
        minimum: 1
        name: page_size
        type: integer
