                data:
                  allOf:
                  - $ref: '#/definitions/model.PaginationResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/definitions/model.SLAPolicy'
                        type: array
                    type: object
              type: object
        "400":
          description: 查询参数无效
