    post:
      description: 需要 risk:manage 权限。立即刷新 KEV 目录和已录入 CVE 的 EPSS 分数，并重算带 CVE 的漏洞。单个数据源失败时在
        errors 中说明，已有缓存保持不变；后台同步进行中返回 409，配置中禁用同步时返回 400。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
