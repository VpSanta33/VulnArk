      summary: 获取风险评分模型
      tags:
      - 风险优先级
    put:
      consumes:
      - application/json
      description: 需要 risk:manage 权限。权重为 0-100 的相对值（无需合计 100），CVSS、资产重要性、暴露面三项不能同时为
        0；阈值须满足 0 < P3 < P2 < P1 <= 100；建议期限为小时且 P1 <= P2 <= P3 <= P4；kev_min_priority
        为空、P1、P2 或 P3。保存后立即按新模型重算全部漏洞并返回重算数量。
      parameters:
      - description: 评分模型
        in: body
