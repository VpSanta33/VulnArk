basePath: /
definitions:
  controller.APICompatibility:
    properties:
      changes:
        items:
          type: string
        type: array
      compatible:
        type: boolean
      from_version:
        type: string
      migration:
        type: string
      to_version:
        type: string
    type: object
  controller.APIEndpoint:
    properties:
      description:
        type: string
      method:
        type: string
      parameters:
        items:
          $ref: '#/definitions/controller.APIParameter'
        type: array
      path:
        type: string
      responses:
        additionalProperties:
          type: string
        type: object
      tags:
        items:
          type: string
        type: array
    type: object
  controller.APIParameter:
    properties:
      description:
        type: string
      example:
        type: string
      in:
        description: query, path, header, body
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  controller.APITestRequest:
    properties:
      body:
        additionalProperties: true
        type: object
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        type: string
      timeout:
        description: 超时时间（秒）
        type: integer
      url:
        type: string
    required:
    - method
    - url
    type: object
  controller.APITestResponse:
    properties:
