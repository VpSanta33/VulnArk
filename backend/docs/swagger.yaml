  /api/v1/vulnerabilities/{id}/retest:
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: 需要 vuln:read 和 vuln:verify 权限及漏洞参与范围或管理/审计权限；当前修复负责人不能复测自己的修复。pass
        仅允许 fixed 转为 verified，fail 可将 fixed、verified 或 closed 转回 processing。multipart/form-data
        使用唯一的 data 字段传入 JSON（如 {"result":"pass","summary":"修复已验证"}），证据文件使用重复的 evidence
        字段；也可使用 application/json 直接提交同样的 result/summary 对象且不带证据。result 必须为 pass 或
        fail，summary 为 1-10000 字符；不接受客户端提供的存储路径或证据元数据。证据每个最多 5 MiB、最多 5 个、合计最多 20
        MiB，部署配置可进一步收紧大小和数量。
      parameters:
      - description: 漏洞ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: JSON对象，包含result（pass/fail）和summary（1-10000字符）
        in: formData
        name: data
        required: true
        type: string
      - description: 可重复提交的证据文件；无证据时可省略
        in: formData
        name: evidence
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: 复测已创建
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.VulnerabilityRetestInfo'
              type: object
        "400":
          description: 请求格式、复测内容或证据无效
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/model.Response'
        "403":
          description: 缺少读取或复测权限，或复测者为当前修复负责人
          schema:
            $ref: '#/definitions/model.Response'
        "404":
          description: 漏洞不存在
          schema:
            $ref: '#/definitions/model.Response'
        "409":
          description: 漏洞不是fixed状态、已验证或并发复测冲突
          schema:
            $ref: '#/definitions/model.Response'
        "413":
          description: 复测请求超过大小限制
          schema:
            $ref: '#/definitions/model.Response'
        "429":
          description: 上传请求过于频繁
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: 复测服务、存储不可用或处理失败
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建独立漏洞复测
      tags:
      - 漏洞复测
