        reason 最长1000字符。
      parameters:
      - description: 漏洞ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 候选漏洞ID
        in: path
        minimum: 1
        name: candidate_id
        required: true
        type: integer
      - description: 恢复理由
        in: body
        name: request
        schema:
          $ref: '#/definitions/model.DuplicateIgnoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/model.Response'
        "403":
          description: 缺少权限或无权访问任一漏洞
          schema:
            $ref: '#/definitions/model.Response'
        "404":
          description: 漏洞或忽略记录不存在
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: 权限检查失败
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 恢复重复漏洞候选
      tags:
      - 漏洞管理
    post:
      consumes:
      - application/json
      description: 需要 vuln:read 和 vuln:update 权限及两个漏洞的访问权限。仅影响当前用户的候选提示，可恢复并保留操作记录；可选
        reason 最长1000字符。
      parameters:
      - description: 漏洞ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 候选漏洞ID
        in: path
        minimum: 1
        name: candidate_id
        required: true
        type: integer
      - description: 忽略理由
        in: body
        name: request
        schema:
          $ref: '#/definitions/model.DuplicateIgnoreRequest'
