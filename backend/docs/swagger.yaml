          schema:
            $ref: '#/definitions/model.Response'
        "403":
          description: 缺少risk:manage权限
          schema:
            $ref: '#/definitions/model.Response'
        "409":
          description: 同步正在进行
          schema:
            $ref: '#/definitions/model.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: 同步失败
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 立即同步威胁情报
      tags:
      - 风险优先级
