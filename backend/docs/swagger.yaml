      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.RiskRescoreResult'
              type: object
        "400":
          description: 配置无效
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/model.Response'
        "403":
          description: 缺少risk:manage权限
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: 保存或重算失败
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新风险评分模型
      tags:
      - 风险优先级
